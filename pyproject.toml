[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tes-client"
version = "0.1.0"
description = "GA4GH TES client with Keycloak OIDC authentication"
authors = [{ name = "Simon Thompson", email = "sse@chi.swan.ac.uk" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["tes_client"]
