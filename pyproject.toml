[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tes-client"
version = "0.1.0"
description = "GA4GH TES client with Keycloak OIDC authentication"
authors = [{ name = "Simon Thompson", email = "sse@chi.swan.ac.uk" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ga4gh", "tes", "task-execution-service", "keycloak", "oidc", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/SwanseaUniversityMedical/tes_client"
Repository = "https://github.com/SwanseaUniversityMedical/tes_client"
Issues = "https://github.com/SwanseaUniversityMedical/tes_client/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["tes_client"]
